name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-test-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Run Unit Tests
        run: npm test

      - name: Run Integration Tests
        run: npm run test:integration

      - name: VSIX Smoke Build
        run: npx --yes @vscode/vsce package --out openplanet-angelscript-languageserver.ci.vsix
